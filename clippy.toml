# Allow unwrap/expect/dbg/print in test code — strict in production, pragmatic in tests.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true

# CLI command handlers and S3 operations naturally have more parameters
# than typical library code. Raise from the default of 7 to 10.
too-many-arguments-threshold = 10

# CLI command handlers are sequential pipelines that are harder to read
# when split artificially. Raise from the default of 100 to 200.
too-many-lines-threshold = 200

# Doc-valid identifiers: append our domain terms to the defaults so
# doc_markdown doesn't flag them as needing backticks.
doc-valid-idents = ["PyO3", "PySide6", "OpenJD", ".."]
