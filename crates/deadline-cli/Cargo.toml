[package]
name = "deadline-cli"
description = "AWS Deadline Cloud CLI"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "deadline_cli"
path = "src/lib.rs"

[[bin]]
name = "deadline"
path = "src/main.rs"

[[bin]]
name = "deadlinew"
path = "src/deadlinew.rs"

[dependencies]
deadline-lib = { workspace = true }
openjd-snapshots = { workspace = true }
aws-sdk-deadline = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
textwrap = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
regex = { workspace = true }
chrono = { workspace = true }
libc = { workspace = true }
thiserror = { workspace = true }
indicatif = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
aws-config = { workspace = true }
serial_test = { workspace = true }
rmcp = { version = "1.5", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde = { workspace = true }
zip = { workspace = true }

# Linux-only: used by handle-web-url to locate `update-desktop-database`.
[target.'cfg(target_os = "linux")'.dependencies]
which = "7"

# Windows-only: registry access for handle-web-url and long-path detection.
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"

[dev-dependencies]
deadline-test-server = { workspace = true }
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
insta = { workspace = true }
insta-cmd = { workspace = true }
rmcp = { version = "1.5", features = ["client", "transport-child-process"] }

[lints]
workspace = true
