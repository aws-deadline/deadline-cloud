[package]
name = "deadline-gui"
description = "AWS Deadline Cloud GUI — Rust models + QML UI via cxx-qt"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gui-test-harness"
path = "src/bin/gui_test_harness.rs"

[dependencies]
deadline-lib = { workspace = true }
cxx = "1.0"
cxx-qt = "0.8"
cxx-qt-lib = { version = "0.8", features = ["qt_full"] }
dirs = "5"
notify = { version = "6", default-features = false, features = ["macos_fsevent"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[build-dependencies]
cxx-qt-build = { version = "0.8", features = ["link_qt_object_files"] }
