# Review tiers for the review policy (aws-deadline/.github
# reusable_review_policy.yml). Read from mainline, so changes take effect once
# merged. Patterns: `**` crosses directories, `*` does not, and a trailing `/`
# matches everything under a directory.
#
# Two tiers: auto (no human approval) and human (one human approval). Both
# need a clean Claude review, where it runs. The policy always requires a human
# for .github/, CODEOWNERS, REVIEW.md, AGENTS.md, CLAUDE.md, .claude/, and this
# file; config here can add to that list but not remove from it. CODEOWNERS,
# not this file, decides who reviews. Dependabot PRs follow the [dependabot]
# rules instead.

# May merge with no human approval: a clean Claude review, from a team member,
# within the size limit.
auto_paths = [
  "**",
]

# Always need a human, even though they match auto_paths. The shipped code,
# which includes credential, telemetry, and path-handling code; build and
# release configuration, and dependency manifests, whose changes ship into
# customers' DCC environments; and the integration tests, which run with AWS
# credentials after merge. PRs labeled security, or with a breaking-change
# title, need a human too.
human_paths = [
  "src/",
  ".semantic_release/",
  "pipeline/",
  "installer/",
  "scripts/",
  "test/integ/",
  "hatch.toml",
  "hatch_custom_hook.py",
  "pyinstaller-version.json",
  "pyproject.toml",
  "requirements*.txt",
]

auto_max_changed_lines = 300

# Release bumps: a human reviews the changelog and what is about to ship.
human_review_authors = ["client-software-ci"]

[dependabot]
# Patch/minor bumps here may merge once CI passes. Absent on purpose: runtime
# dependencies (pyproject.toml), which ship into DCC environments, and
# requirements-testing.txt / requirements-integ-testing.txt, which the
# integration tests install alongside AWS credentials.
auto_merge_files = [
  "requirements-ui-testing.txt",
  "requirements-docs.txt",
]

# Always need a human, even for patch bumps.
human_review_packages = [
  "xa11y",
]

# GitHub Actions from these owners may be bumped without a human.
trusted_action_owners = [
  "actions",
  "aws-actions",
  "github",
  "dependabot",
]
