# Risk tiers for the review policy (aws-deadline/.github
# reusable_review_policy.yml). Read from mainline, so changes take effect once
# merged. Patterns: `**` crosses directories, `*` does not, and a trailing `/`
# matches everything under a directory. Dependabot PRs follow the [dependabot]
# lanes, taking a high-risk path's tier when they need a human. For other PRs:
# high, then human_review_authors (medium), then low; anything else is medium.

# Always need a human, reviewed by a code owner: the shipped code, which
# includes credential, telemetry, and path-handling code. PRs labeled
# security are high risk too.
high_risk_paths = [
  "src/",
]

# May merge with no human approval: a clean Claude review, from a team member,
# within the size limit.
low_risk_paths = [
  "**",
]

# Medium risk, one human approval: CI, build, and release configuration, and
# dependency manifests, whose changes ship into customers' DCC environments.
# Also the integration tests, which run with AWS credentials after merge.
low_risk_exclude = [
  ".github/",
  ".semantic_release/",
  "pipeline/",
  "installer/",
  "scripts/",
  "test/integ/",
  "hatch.toml",
  "hatch_custom_hook.py",
  "pyinstaller-version.json",
  "pyproject.toml",
  "requirements*.txt",
]

low_risk_max_changed_lines = 300

# Release bumps: a human reviews the changelog and what is about to ship.
human_review_authors = ["client-software-ci"]

[dependabot]
# Patch/minor bumps here may merge once CI passes. Absent on purpose: runtime
# dependencies (pyproject.toml), which ship into DCC environments, and
# requirements-testing.txt / requirements-integ-testing.txt, which the
# integration tests install alongside AWS credentials.
auto_merge_files = [
  "requirements-ui-testing.txt",
  "requirements-docs.txt",
]

# Always need a human, even for patch bumps.
human_review_packages = [
  "xa11y",
]

# GitHub Actions from these owners may be bumped without a human.
trusted_action_owners = [
  "actions",
  "aws-actions",
  "github",
  "dependabot",
]
