name: GUI Unit Tests

on:
  push:
    branches: [mainline, release]
  pull_request:
    branches: [mainline, release, 'patch_*', 'feature_*']

jobs:
  gui-unit-test:
    name: GUI Unit Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.11', '3.13']
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xinput0 libxcb-xfixes0 \
            x11-utils libxcb-cursor0 libopengl0

      - name: Install hatch
        run: pip install --upgrade hatch

      - name: Run GUI unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: hatch run gui:test

      - name: Upload coverage report
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: gui-coverage-report
          path: build/coverage-gui/
