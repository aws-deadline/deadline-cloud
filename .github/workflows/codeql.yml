name: "CodeQL"

on:
  push:
    branches: [ "mainline", "feature_*", "patch_*" ]
  pull_request:
    branches: [ "mainline", "feature_*", "patch_*" ]
  schedule:
    - cron: '0 8 * * MON'

# Cancel superseded in-progress runs for the same PR branch. The group key is
# conditional: pull_request events share a per-ref group, while push and
# schedule events get a unique run_id group so they are never canceled by a
# sibling (GitHub cancels PENDING runs in a shared group regardless of
# cancel-in-progress). No draft-skip here: CodeQL is a required status check,
# and gating a required check on draft state would leave it unreported on
# draft PRs and stall the merge queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  Analysis:
    name: Analysis
    uses: aws-deadline/.github/.github/workflows/reusable_codeql.yml@mainline
    permissions:
      security-events: write
