name: Code Quality

on:
  pull_request:
    branches: [ mainline, release, feature_assets_cli, 'patch_*' , "feature_*"]
  push:
    # Run on mainline pushes to populate the Actions cache that PRs restore from.
    branches: [ mainline ]
  workflow_call:
    inputs:
      branch:
        required: false
        type: string
      tag:
        required: false
        type: string

jobs:
  Test:
    name: Python
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    uses: aws-deadline/.github/.github/workflows/reusable_python_build.yml@mainline
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      ref: ${{inputs.tag}}

  Attributions:
    name: Attributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{inputs.tag}}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install hatch
      - run: hatch run attributions:check
