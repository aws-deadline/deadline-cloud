[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "deadline"
version = "0.1.0"
description = "AWS Deadline Cloud client — CLI, GUI, and Python library"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "xa11y",
    "openjd-model>=0.9",
    "pyyaml>=6.0",
    "botocore",
]

[tool.maturin]
manifest-path = "crates/deadline-python-bindings/Cargo.toml"
module-name = "deadline._native"
python-source = "gui"
data = "deadline.data"
features = ["extension-module"]

[tool.pytest.ini_options]
testpaths = ["pytests"]

[tool.ruff]
target-version = "py39"
src = ["gui", "pytests"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
