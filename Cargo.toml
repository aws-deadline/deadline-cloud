[workspace]
members = [
    "crates/deadline-config",
    "crates/deadline-job-attachments",
    "crates/deadline-job-bundle",
    "crates/deadline-api",
    "crates/deadline-cli",
    "crates/deadline-python-bindings",
    "crates/deadline-test-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# Internal crates
deadline-config = { path = "crates/deadline-config" }
deadline-job-attachments = { path = "crates/deadline-job-attachments" }
deadline-job-bundle = { path = "crates/deadline-job-bundle" }
deadline-api = { path = "crates/deadline-api" }
deadline-test-server = { path = "crates/deadline-test-server" }

# OpenJD crates
openjd-snapshots = "0.1"
openjd-expr = "0.1"

# Shared dependencies
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
textwrap = "0.16"
log = "0.4"
env_logger = "0.11"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
indicatif = "0.17"
serde_yaml = "0.9"

# AWS SDK
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-deadline = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-sts = "1"
aws-sdk-cloudwatchlogs = "1"
aws-smithy-types = "1"

# Test dependencies
test-case = "3"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
wiremock = "0.6"
serial_test = "3"
insta = { version = "1", features = ["filters"] }
insta-cmd = "0.6"

[workspace.lints.rust]
unsafe_code = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# ── Group enables ──────────────────────────────────────────────
pedantic = { level = "warn", priority = -1 }

# ── Pedantic overrides (allow) ─────────────────────────────────
module_name_repetitions = "allow"       # deadline_config::ConfigFile is fine
missing_errors_doc = "allow"            # Enable later when docs mature
missing_panics_doc = "allow"            # Enable later when docs mature
must_use_candidate = "allow"            # Too noisy on builders and getters
similar_names = "allow"                 # farm_id/farm_ids is intentional
needless_pass_by_value = "allow"        # Clap derive requires owned types

# Cast lints: relaxed for CLI tool. File sizes, progress percentages,
# API boundary conversions, and display formatting all involve safe casts
# where the domain guarantees correctness (e.g., file sizes are non-negative,
# precision loss is acceptable for human-readable display).
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"

# ── Cherry-picked restriction lints ────────────────────────────
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
unwrap_used = "warn"
# expect_used: not enabled — expect() with a reason is the approved escape
# hatch from unwrap_used. Use .expect("reason") for infallible operations
# (regex literals, mutex locks, serialization of own types) and ? for
# operations that can legitimately fail.
get_unwrap = "warn"
undocumented_unsafe_blocks = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
str_to_string = "warn"
allow_attributes_without_reason = "warn"

# ── Cherry-picked nursery lints ────────────────────────────────
redundant_clone = "warn"
debug_assert_with_mut_call = "warn"
unused_peekable = "warn"

[profile.release]
lto = "thin"    # Cross-crate link-time optimization — smaller + faster binary
strip = true    # Remove debug symbols from release binary
