[workspace]
members = [
    "crates/deadline-models",
    "crates/deadline-common",
    "crates/deadline-config",
    "crates/deadline-job-attachments",
    "crates/deadline-job-bundle",
    "crates/deadline-client",
    "crates/deadline-cli",
    "crates/deadline-mcp",
    "crates/deadline-gui-ffi",
    "crates/deadline-worker-agent",
    "crates/deadline-test-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# Internal crates
deadline-models = { path = "crates/deadline-models" }
deadline-common = { path = "crates/deadline-common" }
deadline-config = { path = "crates/deadline-config" }
deadline-job-attachments = { path = "crates/deadline-job-attachments" }
deadline-job-bundle = { path = "crates/deadline-job-bundle" }
deadline-client = { path = "crates/deadline-client" }
deadline-mcp = { path = "crates/deadline-mcp" }
deadline-gui-ffi = { path = "crates/deadline-gui-ffi" }
deadline-test-server = { path = "crates/deadline-test-server" }

# Shared dependencies
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
textwrap = "0.16"
log = "0.4"
env_logger = "0.11"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }

# Test dependencies
test-case = "3"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
wiremock = "0.6"
