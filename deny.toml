# cargo-deny configuration
# Run: cargo deny check

[advisories]
# Advisories we've reviewed and accepted
ignore = [
    # number_prefix is unmaintained but stable (simple byte-formatting crate,
    # pulled in by indicatif). No security risk, no alternative needed.
    { id = "RUSTSEC-2025-0119", reason = "stable crate, no security impact" },
    # rustls-webpki 0.101.7 vulnerabilities — pinned by hyper-rustls 0.24.2
    # (transitive dep of AWS SDK). Cannot upgrade without upstream release.
    # The newer rustls-webpki 0.103.10 (used by current SDK path) is not affected.
    # TODO: Remove once AWS SDK drops hyper-rustls 0.24 dependency.
    { id = "RUSTSEC-2026-0098", reason = "pinned by transitive dep hyper-rustls 0.24" },
    { id = "RUSTSEC-2026-0099", reason = "pinned by transitive dep hyper-rustls 0.24" },
    { id = "RUSTSEC-2026-0100", reason = "pinned by transitive dep hyper-rustls 0.24" },
    { id = "RUSTSEC-2026-0104", reason = "pinned by transitive dep hyper-rustls 0.24" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
exceptions = [
    # r-efi is LGPL-2.1+ but only used on Windows EFI targets and is
    # dynamically linked. LGPL permits dynamic linking.
    { allow = ["LGPL-2.1-or-later"], crate = "r-efi" },
]

[licenses.private]
ignore = true  # Don't check our own workspace crates

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
